[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codelanche-ai"
version = "0.1.0"
description = "Local AI agents for repository intelligence and deterministic change-impact analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Mukherjee" }]
keywords = [
  "ai-agents",
  "code-intelligence",
  "dependency-graph",
  "impact-analysis",
  "local-ai",
  "ollama",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9",
]

[project.scripts]
codelanche = "codelanche.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codelanche"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["codelanche"]
branch = true

